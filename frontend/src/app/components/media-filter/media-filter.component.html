<div class="filter" role="group" aria-label="Show">
  @for (option of options; track option.value) {
    <button class="filter__option" type="button"
            [class.is-selected]="selected() === option.value"
            [attr.aria-pressed]="selected() === option.value"
            (click)="select(option.value)">
      {{ option.label }}
    </button>
  }
</div>
